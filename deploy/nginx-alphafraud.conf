# nginx site for AlphaFraud. provision.sh substitutes __SERVER_NAME__ and installs this to
# /etc/nginx/sites-available/alphafraud, then certbot --nginx adds the TLS bits.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # Serve the vendored static assets straight from disk (plotly.min.js is ~4.8 MB;
    # let nginx handle it, not gunicorn).
    location /static/ {
        alias /opt/alphafraud/alphafraud/static/;
        # Assets are versioned with a ?v=<mtime> query string, so a changed file fetches
        # fresh while unchanged ones can be cached hard (plotly.min.js is ~4.8 MB).
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location / {
        proxy_pass http://__BIND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    client_max_body_size 4m;
}
